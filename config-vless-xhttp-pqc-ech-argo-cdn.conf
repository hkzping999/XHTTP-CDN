# ============================================================================
# VLESS + XHTTP + PQC + ECH + Argo + Cloudflare CDN 非交互安装模板
# ============================================================================
# 1. 复制本文件并填写 ARGO_DOMAIN / ARGO_AUTH。
# 2. 执行：sudo bash argox.sh -f config-vless-xhttp-pqc-ech-argo-cdn.conf
# 3. ARGO_DOMAIN 必须是 Cloudflare 托管的固定隧道域名；临时
#    trycloudflare.com 不支持本组合。
# ============================================================================

L='C'

# i = VLESS + XHTTP CDN
INSTALL_PROTOCOLS='i'
ALLOW_LEGACY_PROTOCOLS='n'

# VLESS Encryption：ML-KEM-768 + X25519 混合后量子握手。
ENABLE_VLESS_PQC='y'
VLESS_PQC_STRICT='y'
VLESS_PQC_REQUIRE_PREFIX='mlkem768x25519plus'
VLESS_PQC_DISABLE_0RTT='y'
VLESS_PQC_RESUME='600s'
VLESS_PQC_CLIENT_RTT='1rtt'
VLESS_PQC_DECRYPTION=''
VLESS_PQC_ENCRYPTION=''

# CDN 中间层使用 packet-up 最稳，不依赖 Cloudflare gRPC 开关。
XHTTP_CDN_MODE='packet-up'

# XHTTP 上下行分离（可选，默认关闭）。
# 开启后：上行仍走 SERVER；下行通过 Xray downloadSettings 建立独立连接。
# XHTTP_DOWNLOAD_SERVER 可填写另一 Cloudflare 优选域名/IP；Host/SNI 仍使用
# ARGO_DOMAIN，以保证上下行都落到同一个 Tunnel Public Hostname。
# XHTTP_DOWNLOAD_PORT 留空时继承 SERVER_PORT（通常 443）。
ENABLE_XHTTP_SPLIT='n'
XHTTP_DOWNLOAD_SERVER=''
XHTTP_DOWNLOAD_PORT=''

# ECH：原生 Xray 客户端通过 Cloudflare DoH 动态获取轮换后的 ECHConfig。
ENABLE_ECH='y'
ECH_STRICT='y'
ECH_CONFIG=''
ECH_QUERY_DOMAIN='cloudflare-ech.com'
ECH_DNS='https://1.1.1.1/dns-query'

# 必填：Cloudflare 固定 Tunnel 域名与官方 Token / JSON / API Token。
ARGO_DOMAIN='xhttp.example.com'
ARGO_AUTH='REPLACE_WITH_CLOUDFLARE_TUNNEL_TOKEN_OR_JSON'

# CDN 优选入口（域名、IPv4、[IPv6]，可附带 :port）。
SERVER='www.cloudflare.com'

# 本地监听参数。
START_PORT='30000'
NGINX_PORT='8080'  # Tunnel Token 模式必须与 Cloudflare Public Hostname Service 端口一致
WS_PATH='argox'

# 可选；留空自动生成。
UUID=''
NODE_NAME='xhttp-pqc-ech'
SERVER_IP=''

# 本组合不使用 Reality / Hysteria2。
REALITY_DOMAIN=''
REALITY_PRIVATE=''
TLS_SERVER='addons.mozilla.org'
PORT_HOPPING_RANGE=''
