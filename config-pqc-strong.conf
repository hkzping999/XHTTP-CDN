# ============================================================
# Argo-PQC Strong 非交互安装配置 / Non-interactive install config
# ============================================================
# Usage:
#   bash argox.sh -f config-pqc-strong.conf
# Quick mode (-l) ignores this file.
# ============================================================

# 语言 / Language: C = 中文, E = English, empty = default English
L=''

# 协议选择 / Protocol selection
# 默认强化模式 ALLOW_LEGACY_PROTOCOLS='n' 时，只允许 VLESS 家族协议：
#   b = VLESS + Reality Vision     (支持 REALITY_DOMAIN + VLESS PQC)
#   d = VLESS + Reality gRPC       (支持 REALITY_DOMAIN + VLESS PQC)
#   e = VLESS + WS              <-- 默认/最简/推荐
#   i = VLESS + XHTTP CDN（客户端 H2/H1 回退，Argo/Nginx H1 回源）
#   j = VLESS + XHTTP HTTP/3 Direct
# 临时 trycloudflare 默认推荐 e = VLESS + WS；手动选择 b/d 时 Reality 会使用 REALITY_DOMAIN 或 SERVER_IP 直连。
INSTALL_PROTOCOLS='e'

# 是否允许旧兼容协议（VMess/Trojan/Shadowsocks/Hysteria2）
# n = 默认不安装旧协议；y = 可手动安装兼容协议
ALLOW_LEGACY_PROTOCOLS='n'

# VLESS 后量子混合加密 / VLESS Encryption PQC
# 启用后覆盖所有 VLESS 家族协议，包括 Reality Vision / Reality gRPC。
# Reality 仍负责伪装与抗主动探测，PQC 由 VLESS Encryption 提供。
ENABLE_VLESS_PQC='y'
VLESS_PQC_STRICT='y'
VLESS_PQC_REQUIRE_PREFIX='mlkem768x25519plus'

# 安全优先：默认禁用 0-RTT，将 vlessenc 输出规范化为 native.600s
VLESS_PQC_DISABLE_0RTT='y'
VLESS_PQC_RESUME='600s'
# 客户端 share-link/outbound 使用 1rtt；不要填 600s，600s 只属于服务端 decryption。
VLESS_PQC_CLIENT_RTT='1rtt'

# 高级：可预置 xray vlessenc 生成的一对参数；一般留空自动生成
VLESS_PQC_DECRYPTION=''
VLESS_PQC_ENCRYPTION=''

# XHTTP CDN：packet-up 对 CDN / Nginx / Argo 中间层兼容性最高。
XHTTP_CDN_MODE='packet-up'

# XHTTP 上下行分离（可选，默认关闭）。
# 开启后：上行仍走 SERVER；下行通过 Xray downloadSettings 建立独立连接。
# XHTTP_DOWNLOAD_SERVER 可填写另一 Cloudflare 优选域名/IP；Host/SNI 仍使用
# ARGO_DOMAIN，以保证上下行都落到同一个 Tunnel Public Hostname。
# XHTTP_DOWNLOAD_PORT 留空时继承 SERVER_PORT（通常 443）。
ENABLE_XHTTP_SPLIT='n'
XHTTP_DOWNLOAD_SERVER=''
XHTTP_DOWNLOAD_PORT=''

# ECH 由客户端使用；Cloudflare 边缘负责终止 TLS/ECH，VPS 无需部署 ECH 私钥。
ENABLE_ECH='y'
ECH_STRICT='y'
# 留空时动态组合为 ECH_QUERY_DOMAIN + ECH_DNS。
# 也可填写固定的 base64 ECHConfig，或完整的 Xray ECH DNS 查询表达式。
ECH_CONFIG=''
ECH_QUERY_DOMAIN='cloudflare-ech.com'
ECH_DNS='https://1.1.1.1/dns-query'

# Argo Tunnel：留空 = 临时 trycloudflare；固定隧道填域名与 token/json/api token
ARGO_DOMAIN=''
ARGO_AUTH=''

# 端口
START_PORT=''
NGINX_PORT=''

# Reality / TLS 参数（仅在选择 Reality/Direct 类协议时使用）
REALITY_PRIVATE=''

# Reality 客户端连接域名：只影响客户端连接地址，留空则使用 SERVER_IP。
# 注意：这不是 Reality 伪装站 / SNI；伪装站仍由 TLS_SERVER 控制。
# 示例：REALITY_DOMAIN='reality.example.com'
REALITY_DOMAIN=''

TLS_SERVER='addons.mozilla.org'

# Hysteria2 port hopping（默认不用）
PORT_HOPPING_RANGE=''

# WS/XHTTP 优选域名；留空使用脚本默认 CDN
SERVER=''

# Xray 通用参数
UUID=''
WS_PATH='argox'
NODE_NAME=''
SERVER_IP=''
